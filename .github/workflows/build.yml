name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify generated modifier catalog
        run: python3 tools/generate_pickaxe_catalog.py --check

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify Minecraft gameplay regressions
        timeout-minutes: 10
        run: ./gradlew runGameTestServer

  client-rendering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify generated modifier catalog
        run: python3 tools/generate_pickaxe_catalog.py --check

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify sculk client rendering
        timeout-minutes: 10
        run: |
          rm -f run/sculk-render-check-passed.txt
          ./gradlew runSculkRenderCheck
          test -f run/sculk-render-check-passed.txt

  asset-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-assets.txt
      - run: python tools/finish_item_assets.py --check
      - run: python tools/audit_minecraft_assets.py
      - run: python tools/test_asset_guardrails.py
