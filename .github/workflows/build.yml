name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify sniffer head death drops in Minecraft
        timeout-minutes: 10
        run: ./gradlew runGameTestServer

  client-rendering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify sculk client rendering
        timeout-minutes: 10
        run: |
          rm -f run/sculk-render-check-passed.txt
          ./gradlew runSculkRenderCheck
          test -f run/sculk-render-check-passed.txt

      - name: Inspect native mouse and menu dispatch
        run: |
          task_mc_jar=$(find /home/runner/.gradle/caches -name 'minecraft-patched-26.3.0.77.jar' -print -quit)
          test -n "$task_mc_jar"
          javap -c -p -classpath "$task_mc_jar" net.minecraft.client.MouseHandler net.minecraft.client.input.MouseButtonEvent net.minecraft.client.input.MouseButtonInfo net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.events.AbstractContainerEventHandler net.minecraft.client.gui.components.events.ContainerEventHandler net.minecraft.server.network.ServerGamePacketListenerImpl net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.client.multiplayer.ClientCommonPacketListenerImpl > build/native-input-dispatch.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('build/native-input-dispatch.txt').read_text()
          sections = re.split(r'(?=^  [^ ].*[;{]$)', text, flags=re.M)
          for section in sections:
              if re.search(r'mouseClicked|mouseReleased|mouseDragged|onPress|onButton|handleContainerClick|handleCustomPayload|getCarried|setCarried|broadcastCarried|\.send\(|button\(', section):
                  print(section)
          PY
