name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Inspect Minecraft interaction API
        run: |
          task_mc_jar=$(python3 -c 'import pathlib,zipfile
          for root in ("/home/runner/.gradle", "/home/runner/work/mod/mod/.gradle"):
            for path in pathlib.Path(root).rglob("*.jar"):
              try:
                with zipfile.ZipFile(path) as archive:
                  if "net/minecraft/world/entity/animal/Animal.class" in archive.namelist():
                    print(path); raise SystemExit
              except (OSError,zipfile.BadZipFile): pass')
          test -n "$task_mc_jar"
          javap -classpath "$task_mc_jar" -p net.minecraft.gametest.framework.GameTestHelper
          javap -classpath "$task_mc_jar" -c -p net.minecraft.world.entity.animal.Animal
          javap -classpath "$task_mc_jar" -c -p net.minecraft.world.entity.Mob | python3 -c 'import sys,re; active=False
          for line in sys.stdin:
            if re.match(r"  (public|protected|private)",line): active="interact" in line.lower()
            if active: print(line,end="")'

      - name: Verify sniffer head death drops in Minecraft
        timeout-minutes: 10
        run: ./gradlew runGameTestServer
