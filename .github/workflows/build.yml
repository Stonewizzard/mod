name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify sniffer head death drops in Minecraft
        timeout-minutes: 10
        run: ./gradlew runGameTestServer

  client-rendering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify sculk client rendering
        timeout-minutes: 10
        run: |
          rm -f run/sculk-render-check-passed.txt
          ./gradlew runSculkRenderCheck
          test -f run/sculk-render-check-passed.txt
      - name: Verify rejection of the obsolete mouse-button code
        run: |
          task_input_source=src/main/java/com/example/examplemod/client/ExcavationInput.java
          cp "$task_input_source" /tmp/excavation-input-original.java
          trap 'cp /tmp/excavation-input-original.java "$task_input_source"' EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/example/examplemod/client/ExcavationInput.java')
          p.write_text(p.read_text().replace('event.button()==InputConstants.MOUSE_BUTTON_LEFT', 'event.button()==0'))
          PY
          if ./gradlew runSculkRenderCheck > build/obsolete-input-check.log 2>&1; then
            cat build/obsolete-input-check.log
            exit 1
          fi
          grep -F 'Native primary click must open Inventory' build/obsolete-input-check.log
          echo 'EXCAVATION_INPUT_NEGATIVE_CONTROL: PASS: the original button-code bug is detected'
