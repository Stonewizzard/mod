name: Real Minecraft visual QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/client-visual-qa.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'src/main/java/com/example/examplemod/ExampleModClient.java'
      - 'tools/client_qa/**'
      - 'src/main/java/com/example/examplemod/client/ClientVisualQa.java'
      - 'src/main/java/com/example/examplemod/client/FieldGuide*.java'
      - 'src/main/java/com/example/examplemod/client/GuideBook*.java'
      - 'src/main/java/com/example/examplemod/GuideDesign.java'
      - 'src/main/java/com/example/examplemod/FieldGuide*.java'
      - 'src/main/resources/assets/examplemod/**/ancient_field_guide*'
      - 'tools/field-guide.json'
      - 'src/main/java/com/example/examplemod/*Forge*.java'
      - 'src/main/java/com/example/examplemod/*Anvil*.java'
      - 'src/main/java/com/example/examplemod/client/*Anvil*.java'
      - 'src/main/resources/assets/examplemod/**/ancient_anvil*'
      - 'src/main/java/com/example/examplemod/client/*Forge*.java'
      - 'src/main/resources/assets/examplemod/models/block/ruined*'
      - 'src/main/resources/data/examplemod/worldgen/**'
permissions:
  contents: read
jobs:
  minecraft-window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and native input/capture tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y xvfb xauth xdotool x11-utils imagemagick ffmpeg mesa-utils mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64
      - name: Build and validate catalog
        run: |
          chmod +x gradlew
          python3 tools/generate_pickaxe_catalog.py --check
          ./gradlew classes
      - name: Drive the actual Minecraft window
        timeout-minutes: 12
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          SDL_VIDEODRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash tools/client_qa/run.sh
      - name: Export real screenshots for visual inspection
        if: always()
        run: python3 tools/client_qa/export_evidence.py
      - name: Upload screenshots, video, live state and client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-minecraft-visual-qa
          path: build/client-qa/
          retention-days: 14
